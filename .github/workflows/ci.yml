name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_to_marketplace:
        description: '发布 pre-release 到 VS Code Marketplace'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare-deps:
    name: 预热 Node 依赖缓存
    runs-on: ubuntu-latest
    outputs:
      deps_cache_key: ${{ steps.deps-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 生成依赖缓存键
        id: deps-cache-key
        run: echo "key=ubuntu-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: 恢复 node_modules 缓存
        id: restore-node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: 安装依赖
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 保存 node_modules 缓存
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.deps-cache-key.outputs.key }}

  lint-and-typecheck:
    name: 代码检查
    runs-on: ubuntu-latest
    needs: [prepare-deps]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 恢复 node_modules 缓存
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare-deps.outputs.deps_cache_key }}
          fail-on-cache-miss: true

      - name: 类型检查
        run: npm run check-types

      - name: ESLint 代码风格检查
        run: npm run lint

  grammar-tests:
    name: 无 VS Code 单元测试
    runs-on: ubuntu-latest
    needs: [prepare-deps]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 恢复 node_modules 缓存
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare-deps.outputs.deps_cache_key }}
          fail-on-cache-miss: true

      - name: 编译测试
        run: npm run compile-tests

      - name: 运行无 VS Code 单元测试
        run: npx mocha --ui tdd --timeout 10000 --require out/test/setup.js out/test/csmlogDocumentSymbolProvider.test.js out/test/csmlogHoverProvider.test.js out/test/hoverData.test.js out/test/hoverDataModules.test.js out/test/lvcsmDocumentSymbolProvider.test.js out/test/moduleManagerController.test.js out/test/moduleManager.test.js out/test/authService.test.js out/test/moduleManagerBoundary.test.js out/test/githubModuleService.test.js out/test/i18n.test.js out/test/sort.test.js out/test/moduleSidebarHtml.test.js out/test/logFold/detector.test.js out/test/logFold/foldingProvider.test.js out/test/logFold/normalizer.test.js out/test/logFold/performance.test.js out/test/labviewVersionDetector.test.js out/test/common/tempPaths.test.js out/test/modules/utils.test.js out/test/modules/topics.test.js out/test/modules/userFacingErrors.test.js out/test/providers/fileDecorationProvider.test.js

  extension-tests:
    name: 扩展集成测试
    runs-on: ubuntu-latest
    needs: [prepare-deps]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 恢复 node_modules 缓存
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare-deps.outputs.deps_cache_key }}
          fail-on-cache-miss: true

      - name: 安装 Xvfb（虚拟显示器）
        run: sudo apt-get install -y xvfb

      - name: 运行完整扩展测试（含 VS Code，pretest 自动编译）
        run: xvfb-run -a npm test

  build-vsix:
    name: 构建 VSIX 扩展包
    runs-on: ubuntu-latest
    needs: [prepare-deps, lint-and-typecheck, grammar-tests, extension-tests]
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      artifact_name: csm-vsc-support-${{ steps.version.outputs.build_version }}-vsix
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      # 获取仓库路径相关环境变量（用于 FTP 备份路径）
      # https://github.com/marketplace/actions/github-environment-variables-action
      - uses: FranzDiebold/github-env-vars-action@v2

      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 恢复 node_modules 缓存
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare-deps.outputs.deps_cache_key }}
          fail-on-cache-miss: true

      - name: 计算版本号
        id: version
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          BUILD_VERSION="${YEAR}.${MONTH}.${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 打包 VSIX（vsce package）
        # --no-dependencies：所有依赖均为 devDependencies，esbuild 已将运行时代码
        # 打包至 dist/extension.js，无需在 VSIX 中内嵌 node_modules
        # 版本号格式：年.月.build（三段式 semver），例如 2026.6.42
        # Main 分支以 --pre-release 发布为 Beta 版本，Tag 发布为正式 Release
        # --no-update-package-json：仅将版本号注入 VSIX 包，不修改 package.json
        run: |
          if [[ "${{ steps.version.outputs.is_prerelease }}" == "true" ]]; then
            npx @vscode/vsce@3.7.1 package ${{ steps.version.outputs.build_version }} --no-dependencies --no-update-package-json --pre-release
          else
            npx @vscode/vsce@3.7.1 package ${{ steps.version.outputs.build_version }} --no-dependencies --no-update-package-json
          fi

      - name: 上传 VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csm-vsc-support-${{ steps.version.outputs.build_version }}-vsix
          path: '*.vsix'
          retention-days: 30

      # 通过 FTP 备份构建产物
      # https://github.com/marketplace/actions/simple-ftp-upload
      - name: 准备 VSIX 备份目录
        run: |
          mkdir -p vsix-backup
          cp *.vsix vsix-backup/

      - name: 通过 FTP 备份 VSIX
        uses: dennisameling/ftp-upload-action@v1.0.9
        with:
          server: ${{ secrets.VIPM_FTP_IP }}
          port: ${{ secrets.VIPM_FTP_PORT }}
          username: ${{ secrets.VIPM_FTP_USER }}
          password: ${{ secrets.VIPM_FTP_PASSWORD }}
          secure: false
          server_dir: /${{ env.CI_REPOSITORY_OWNER_SLUG }}/${{ env.CI_REPOSITORY_NAME }}/${{ env.CI_ACTION_REF_NAME }}/
          local_dir: ./vsix-backup/

  validate-vsix:
    name: 验证 VSIX 可正常被 VS Code 加载 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build-vsix]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载 VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-vsix.outputs.artifact_name }}

      - name: 验证 VSIX 结构与 manifest
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path . -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) {
            throw 'FAILED: No VSIX artifact found.'
          }
          Write-Host "验证 VSIX: $($vsix.Name)"

          # 1. ZIP 完整性检查
          $extractDir = Join-Path (Get-Location) 'vsix-unpacked'
          if (Test-Path $extractDir) {
            Remove-Item -LiteralPath $extractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $vsix.FullName -DestinationPath $extractDir -Force
          Write-Host '✓ ZIP 结构完整'

          # 2. 解析 extension/package.json，验证版本号与必需字段
          $packageJsonPath = Join-Path $extractDir 'extension/package.json'
          if (-not (Test-Path $packageJsonPath)) {
            throw 'FAILED: extension/package.json not found in VSIX.'
          }
          Copy-Item -LiteralPath $packageJsonPath -Destination ./vsix-pkg.json -Force
          @'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./vsix-pkg.json', 'utf8'));
          // 版本号须为有效 semver（如 2026.4.42）
          // VS Code 扩展扫描器使用 semver 解析版本号，非法 semver 会导致"无法读取扩展"错误
          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          if (!semverPattern.test(pkg.version)) {
            console.error('FAILED: version "' + pkg.version + '" is not valid semver. VS Code cannot load this extension.');
            process.exit(1);
          }
          console.log('✓ 版本号合法: ' + pkg.version);
          // VS Code manifest 真正必需的字段
          for (const field of ['name', 'publisher', 'engines']) {
            if (!pkg[field]) {
              console.error('FAILED: package.json missing VS Code required field: ' + field);
              process.exit(1);
            }
          }
          if (!pkg.engines.vscode) {
            console.error('FAILED: package.json missing engines.vscode');
            process.exit(1);
          }
          console.log('✓ VS Code 必需字段完整 (name, publisher, engines.vscode)');
          // 本扩展必须字段（有 main 说明是 code 扩展；有 contributes 说明语言注册存在）
          for (const field of ['main', 'contributes']) {
            if (!pkg[field]) {
              console.error('FAILED: package.json missing extension-required field: ' + field);
              process.exit(1);
            }
          }
          console.log('✓ 扩展必需字段完整 (main, contributes)');
          '@ | node

          # 3. 验证主入口文件存在于 VSIX 中
          $main = node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('./vsix-pkg.json','utf8'));process.stdout.write(p.main||'')"
          $mainRelativePath = if ($main.StartsWith('./')) { $main.Substring(2) } else { $main }
          $mainInVsix = Join-Path $extractDir (Join-Path 'extension' $mainRelativePath)
          if (-not (Test-Path $mainInVsix)) {
            throw "FAILED: main entry not found in VSIX: extension/$mainRelativePath"
          }
          Write-Host "✓ 主入口文件存在: extension/$mainRelativePath"

          Write-Host '✓ VSIX 验证通过，可正常被 VS Code 加载'

  upload-to-release:
    name: 上传 VSIX 到 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-vsix, validate-vsix]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: 下载 VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-vsix.outputs.artifact_name }}

      - name: 上传 VSIX 到 GitHub Release
        run: |
          VSIX=$(ls *.vsix | head -1)
          TAG="${{ github.ref_name }}"
          echo "上传 VSIX: $VSIX → Release $TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$VSIX" \
              --title "$TAG" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish-to-marketplace:
    name: 发布到 VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [build-vsix, validate-vsix]
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_marketplace == 'true') || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载 VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-vsix.outputs.artifact_name }}

      - name: 检查 Marketplace PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret 未配置，无法发布到 Marketplace"
            exit 1
          fi

      - name: 发布到 VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX=$(ls *.vsix | head -1)
          if [[ "${{ needs.build-vsix.outputs.is_prerelease }}" == "true" ]]; then
            echo "发布 Beta 预发布版本: $VSIX"
            npx @vscode/vsce@3.7.1 publish --packagePath "$VSIX" --pat "$VSCE_PAT" --pre-release
          else
            echo "发布正式 Release 版本: $VSIX"
            npx @vscode/vsce@3.7.1 publish --packagePath "$VSIX" --pat "$VSCE_PAT"
          fi
